name: Deploy OCI API

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oci-api-production-caddy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy API
    runs-on: [self-hosted, linux, ARM64, jobin-oci-caddy-production]
    timeout-minutes: 45
    steps:
      - name: Check out main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Deploy API stack
        shell: bash
        env:
          DEPLOY_ENV_FILE: /opt/jobin/deploy/oci/.env
        run: |
          set -Eeuo pipefail

          workspace_env="$GITHUB_WORKSPACE/deploy/oci/.env"
          if [[ ! -r "$DEPLOY_ENV_FILE" ]]; then
            echo "::error::OCI deployment environment file is missing or unreadable: $DEPLOY_ENV_FILE"
            exit 1
          fi

          install -m 600 "$DEPLOY_ENV_FILE" "$workspace_env"
          trap 'rm -f -- "$workspace_env"' EXIT

          compose=(docker compose --env-file "$workspace_env" -f "$GITHUB_WORKSPACE/deploy/oci/compose.yaml")
          "${compose[@]}" config --quiet

          if ! "${compose[@]}" up -d --build --wait --wait-timeout 600; then
            "${compose[@]}" logs --tail=150 db api proxy
            exit 1
          fi

          "${compose[@]}" ps
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-connrefused \
            https://api.jobin.today/api/health/ready
